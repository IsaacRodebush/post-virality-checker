<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Post Virality Checker</title>
<style>
:root{--bg:#fff7f3;--card:#fff;--ink:#2d2433;--mut:#7a6f80;--acc:#e8577e;--acc2:#7b5cff;--ok:#2fae6b;--mid:#f0a52b;--bad:#e5484d}

header{background:linear-gradient(120deg,var(--acc),var(--acc2));color:#fff;padding:22px 16px;text-align:center}
header h1{margin:0;font-size:1.6rem}header p{margin:6px 0 0;opacity:.9}
main{max-width:860px;margin:auto;padding:14px}
.card{background:var(--card);border-radius:16px;padding:16px;margin:14px 0;box-shadow:0 2px 10px rgba(80,40,90,.08)}
label{display:block;font-weight:600;margin:10px 0 4px;font-size:.92rem}
input,select,textarea{width:100%;padding:10px;border:1px solid #e4d9e8;border-radius:10px;font:inherit;background:#fffdfd}
textarea{min-height:220px;font-size:17px}
.lead{font-size:1.2rem;font-weight:600;margin:0 0 10px}button.big{width:100%;padding:18px;font-size:1.2rem;margin-top:12px}
button.copy{min-height:40px;padding:8px 16px!important;font-size:.95rem!important}
.more{margin:20px 0;color:var(--mut)}.more summary{cursor:pointer;padding:12px;font-size:.9rem}.more>div,.more>p{padding:0 8px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){.row{grid-template-columns:1fr}}
button{background:var(--acc);color:#fff;border:0;border-radius:999px;padding:11px 20px;font:inherit;font-weight:600;cursor:pointer}
button.sec{background:#efe7f3;color:var(--ink)}button.copy{padding:4px 12px;font-size:.8rem;background:var(--acc2);margin-left:8px}
.hint{color:var(--mut);font-size:.82rem}
#scoreWrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
#ring{width:120px;height:120px;border-radius:50%;display:grid;place-items:center;font-size:2rem;font-weight:800}
#ring span{background:#fff;width:92px;height:92px;border-radius:50%;display:grid;place-items:center}
.factor{border-top:1px solid #f1e8f3;padding:10px 0}.fhead{display:flex;justify-content:space-between;font-weight:600}
.bar{height:8px;background:#f1e8f3;border-radius:6px;margin:6px 0;overflow:hidden}.bar i{display:block;height:100%}
.fix{color:var(--acc2);font-size:.9rem}.reason{font-size:.9rem;color:var(--mut)}
.sug{background:#faf6ff;border-radius:10px;padding:8px 10px;margin:6px 0;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sug pre{white-space:pre-wrap;margin:0;font:inherit;flex:1}
#preview{max-width:160px;max-height:200px;border-radius:10px;margin-top:8px;display:none}
.hist{cursor:pointer;padding:8px;border-radius:8px}.hist:hover{background:#faf6ff}
.note{font-size:.82rem;color:var(--mut);font-style:italic}
</style></head><body>
<header><h1>✨ Post Virality Checker</h1></header>
<main>
<div class="card"><p class="lead">Paste your post.</p>
<textarea id="caption" aria-label="Your post" placeholder="Paste your caption here (hashtags too)…"></textarea>
<div class="hint"><span id="cc">0</span> characters</div>
<button id="go" class="big">Check my post</button></div>
<div class="card" id="result" style="display:none">
<div id="scoreWrap"><div id="ring"><span id="score">0</span></div><div><h2 id="label" style="margin:0"></h2><div id="fmtNote" class="hint"></div><div class="note">This is a rough guide based on common best practices, not a guarantee. Real reach depends on the algorithm, your audience, timing and luck.</div></div></div>
<div id="factors"></div></div>
<div class="card" id="improve" style="display:none"><h2>💡 How to improve</h2><div id="impBody"></div></div>
<details class="more"><summary>More options</summary><div class="row"><div><label for="platform">Platform</label><select id="platform"></select></div>
<div><label for="format">Format</label><select id="format"></select></div></div>
<div id="soon" class="hint"></div>
<label for="hashtags">Hashtags <span class="hint">(optional — we also pick up #tags inside the caption)</span></label>
<input id="hashtags" placeholder="#homedecor #diy">
<div class="row"><div><label for="image">Image (optional)</label><input type="file" id="image" accept="image/*"><img id="preview" alt="preview"><div id="ar" class="hint"></div></div>
<div><label for="link">Link (optional)</label><input id="link" placeholder="https://…">
<label for="vlen">Video length, seconds (optional)</label><input id="vlen" type="number" min="0"></div></div>
<div class="row"><div><label for="pday">Planned day</label><select id="pday"><option value="">—</option></select></div>
<div><label for="ptime">Planned time</label><input id="ptime" type="time"></div></div>
<label for="trends">Custom trends / keywords right now <span class="hint">(comma separated, optional)</span></label>
<input id="trends" placeholder="e.g. fall reset, taylor swift, sourdough">

<p><button class="sec" id="save">Save draft</button></p>
<div ><h3 style="margin-top:0">📝 Saved drafts</h3><div id="history" class="hint">No drafts yet.</div><p><button class="sec" id="clearH">Clear history</button></p></div>
</details>
</main>

<script>

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function col(s){return s>=75?"var(--ok)":s>=50?"var(--mid)":"var(--bad)"}
function detectFormat(c){c=c.toLowerCase();if(/(swipe|slide|carousel|\n\s*\d+[.)]|^\s*\d+[.)])/m.test(c))return"carousel";if(/(photo|pic|picture|snapshot|selfie|portrait)\b/.test(c)&&!/(reel|video|watch|clip)/.test(c))return"single";if(/\bstory\b/.test(c))return"story";return"reel"}
function gather(){var pl=$("platform").value,fm=$("format").value;if(fm==="auto"){var P=PLATFORMS[pl];fm=pl==="instagram"?detectFormat($("caption").value):Object.keys(P.formats)[0]}var nd=new Date();return{platform:pl,format:fm,caption:$("caption").value,hashtags:$("hashtags").value,link:$("link").value,videoLength:$("vlen").value,day:$("pday").value!==""?$("pday").value:String(nd.getDay()),time:$("ptime").value||(String(nd.getHours()).padStart(2,"0")+":"+String(nd.getMinutes()).padStart(2,"0")),trends:$("trends").value,aspect:aspect}}
function sug(t){return '<div class="sug"><pre>'+esc(t)+'</pre><button class="copy" data-t="'+esc(t)+'">Copy</button></div>'}
function render(){var r=score(gather());$("result").style.display="block";$("score").textContent=r.score;$("ring").style.background="conic-gradient("+col(r.score)+" "+r.score*3.6+"deg,#f1e8f3 0)";$("label").textContent=r.label;$("fmtNote").textContent="Checked as: "+r.platform.name+" "+r.format.name+" · posting now ("+new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})+")";
$("factors").innerHTML=r.factors.map(function(f){return '<div class="factor"><div class="fhead"><span>'+esc(f.name)+' </span><span>'+f.score+'/100</span></div><div class="bar"><i style="width:'+f.score+'%;background:'+col(f.score)+'"></i></div><div class="reason">'+esc(f.reason)+'</div>'+(f.score<85?'<div class="fix">Try: '+esc(f.fix)+'</div>':'')+'</div>'}).join("");
if(r.showImprove){var m=r.improve,h="<h3>🎣 Stronger hook ideas</h3>"+m.hooks.map(sug).join("");
 h+="<h3>#️⃣ Hashtag ideas</h3>"+sug(m.hashtags.add.join(" "))+(m.hashtags.remove.length?'<p class="reason">Consider removing: '+esc(m.hashtags.remove.join(" "))+'</p>':'');
 if(m.trimmed)h+="<h3>✂️ Shorter version</h3>"+sug(m.trimmed);
 h+="<h3>📣 Call-to-action lines</h3>"+m.ctas.map(sug).join("");
 h+="<h3>🎬 Format ideas</h3><ul>"+m.format.map(function(a){return"<li>"+esc(a)+"</li>"}).join("")+"</ul>";
 $("impBody").innerHTML=h;$("improve").style.display="block"}else $("improve").style.display="none";
return r}
document.addEventListener("click",function(e){var b=e.target.closest(".copy");if(!b)return;var t=b.getAttribute("data-t");var done=function(){b.textContent="Copied!";setTimeout(function(){b.textContent="Copy"},1500)};
 if(navigator.clipboard&&window.isSecureContext)navigator.clipboard.writeText(t).then(done,fallback);else fallback();function fallback(){var ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand("copy")}catch(x){}ta.remove();done()}});
$("go").onclick=function(){render();$("result").scrollIntoView({behavior:"smooth"})};
var KEY="pvc_history";function hist(){try{return JSON.parse(localStorage.getItem(KEY))||[]}catch(e){return[]}}
function showHist(){var h=hist();$("history").innerHTML=h.length?h.map(function(d,i){return'<div class="hist" data-i="'+i+'"><b>'+esc(d.score)+'</b> · '+esc(PLATFORMS[d.input.platform].name)+' · '+esc((d.input.caption||"").slice(0,60))+'… <span class="hint">'+esc(d.when)+'</span></div>'}).join(""):"No drafts yet."}
$("save").onclick=function(){var r=render(),h=hist(),inp=gather();h.unshift({input:inp,score:r.score,when:new Date().toLocaleString()});localStorage.setItem(KEY,JSON.stringify(h.slice(0,30)));showHist()};
$("history").onclick=function(e){var d=e.target.closest(".hist");if(!d)return;var x=hist()[+d.dataset.i].input;$("platform").value=x.platform;fillFormats();["format","caption","hashtags","link","trends"].forEach(function(k){$(k).value=x[k]||""});$("vlen").value=x.videoLength||"";$("pday").value=x.day;$("ptime").value=x.time||"";aspect=x.aspect;$("cc").textContent=x.caption.length;render()};
$("clearH").onclick=function(){if(confirm("Clear all saved drafts?")){localStorage.removeItem(KEY);showHist()}};showHist();
})();
</script></body></html>
